[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-experimentation-analytics"
version = "0.1.0"
description = "E-commerce funnel analytics and randomized campaign evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<3.0",
  "scipy>=1.11,<2.0",
  "statsmodels>=0.14,<1.0",
  "matplotlib>=3.7,<4.0"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1.0"]

[project.scripts]
ecommerce-study = "ecommerce_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
