name: Analytics checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit and integration tests
        run: pytest -q
      - name: Smoke demo
        run: ecommerce-study demo --output outputs/ci-demo --bootstrap 100
      - name: Verify HTML artefact
        run: test -s outputs/ci-demo/index.html
